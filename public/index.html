<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f7f5;--card:#fff;--text:#1d1d1b;--muted:#77756f;--line:#e6e4de;--accent:#2f6f5e;--soft:#e8f1ee;--pos:#1f8a5b;--neg:#c4412f;--bt:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#1f1f1d;--text:#f1f0ec;--muted:#9a978f;--line:#33322f;--accent:#6fbfa8;--soft:#243530;--pos:#52c48f;--neg:#ee7b69;--bt:#10201a}}
:root[data-theme="dark"]{--bg:#161615;--card:#1f1f1d;--text:#f1f0ec;--muted:#9a978f;--line:#33322f;--accent:#6fbfa8;--soft:#243530;--pos:#52c48f;--neg:#ee7b69;--bt:#10201a}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:22px;margin:0 0 2px;font-weight:650}
h2{font-size:15px;margin:0;font-weight:650}
.sub{color:var(--muted);margin:0 0 14px;font-size:13px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;font:inherit;font-size:17px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}nav button svg{flex:none}@media (max-width:520px){nav button{font-size:15px;padding:10px 10px;gap:6px}}
nav button.on{color:var(--accent);border-color:var(--accent)}
.fb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.chip{font:inherit;font-size:13px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:4px 12px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--bt);border-color:var(--accent)}
.rsw{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px 6px 2px 10px;color:var(--accent)}.rsw select{width:auto;border:0;background:transparent;font-weight:600;font-size:14px;padding:5px 2px;cursor:pointer;color:var(--text)}
.rg{font-size:12px;color:var(--muted);margin:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.grid .card{margin:0}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:650;margin-top:2px;word-break:break-word}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.click{cursor:pointer}.click:hover{border-color:var(--accent)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.two .card{margin:0}.two{margin-bottom:12px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.row .n{flex:1;min-width:0}.row .n small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;font-size:15px;padding:2px 6px}
.x:hover{color:var(--neg)}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
.btn{font:inherit;font-size:13px;background:var(--accent);color:var(--bt);border:0;border-radius:8px;padding:6px 12px;cursor:pointer;width:auto}
.btn.g{background:none;color:var(--text);border:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.cv{position:relative;height:240px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px;font-size:14px}
th,td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;border-top:0}
th:first-child,td:first-child{text-align:left}
td small{display:block;color:var(--muted);font-size:11px}
.tag{font-size:11px;background:var(--soft);color:var(--accent);padding:1px 7px;border-radius:10px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.gm{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-top:6px}
.cat{padding:6px 0;border-top:1px solid var(--line)}.sb{padding-left:18px;color:var(--muted)}
.cat .l,.sb .l{display:flex;gap:4px;align-items:center}.cat .l span,.sb .l span{flex:1}
.md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;overflow:auto;z-index:9}
.md[hidden]{display:none}.mc{width:100%;max-width:440px;margin:0}
.fl{display:block;font-size:12px;color:var(--muted);margin-top:10px}.fl>*{margin-top:3px;color:var(--text)}
.mb{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.iw{position:relative;display:block}.sgs{position:absolute;right:0;bottom:calc(100% + 2px);display:flex;gap:6px;z-index:3;background:var(--card);padding:4px;border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.3)}.sgs:empty{display:none}
.fabw{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8}.fabw[hidden],.fabm[hidden]{display:none!important}.ro .fabw{display:none!important}
.fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:transform .15s}.fab:hover{transform:scale(1.07)}.fab:active{transform:scale(.95)}
.fabm{position:absolute;right:0;bottom:70px;min-width:250px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:6px}.fabm button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:11px 12px;font:inherit;font-size:15px;color:var(--text);cursor:pointer}.fabm button:hover{background:var(--soft)}.fabm i{width:10px;height:10px;border-radius:50%;flex:none}
.ro [data-a="add"],.ro [data-a="edit"],.ro [data-a="del"],.ro [data-a="cadd"],.ro [data-a="sadd"],.ro [data-a="cedit"],.ro [data-a="sedit"],.ro [data-a="cdel"],.ro [data-a="sdel"],.ro [data-a="cres"],.ro input[data-a="tv"],.ro input[data-a="tr"],.ro .x{display:none}
.fabm svg{flex:none}
button[data-a="add"]:not([data-k="itx"]):not([data-k="price"]):not([data-k="bulk"]){display:none}
/* ---------- Bán hàng ---------- */
nav .tm{margin-left:auto;padding:12px}
.ro .w{display:none!important}
.sbn .chip{font-size:14px;padding:7px 14px}
.kpi .v{font-size:22px}
.posw{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:12px;align-items:start}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;user-select:none;transition:transform .08s}
.pc:hover{border-color:var(--accent)}.pc:active{transform:scale(.97)}.pc.out{opacity:.45}
.pc b{font-size:14px;line-height:1.3;font-weight:600}.pc .pp{font-weight:700;color:var(--accent)}
.im{position:relative;height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;flex:none}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.im.sm{width:40px;height:40px;font-size:18px}
.cart{position:sticky;top:64px;margin:0}
.cl{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.cl small{color:var(--muted);font-size:12px;display:block}
.qb{min-width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:18px;cursor:pointer;flex:none}
.qb:disabled{opacity:.35;cursor:default}
.qv{width:52px;text-align:center;padding:6px 2px}
.tl{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.tl.big{font-size:20px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.pay{display:block;width:100%;font-size:18px;font-weight:700;padding:14px;border-radius:12px;margin-top:10px;letter-spacing:.5px}
.pay:disabled{opacity:.4;cursor:default}
.pbar{display:none}
.bdg{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--soft);color:var(--accent);white-space:nowrap}
.bdg.bw{background:rgba(209,154,58,.18);color:#d19a3a}.bdg.bo{background:rgba(196,65,47,.16);color:var(--neg)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.ck{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;cursor:pointer}.ck input{width:auto}
.rc table{min-width:0;font-size:13px;margin:8px 0}.rc th,.rc td{padding:4px 2px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.bad{background:var(--neg);color:#fff}.toast[hidden]{display:none}
/* ---------- Giao diện pastel (0.0.5) ---------- */
:root{--bg:#fbf8f4;--card:#fff;--text:#2f2b38;--muted:#857f91;--line:#eee7de;--accent:#2f8a6d;--soft:#e2f4ec;--pos:#24875f;--neg:#cc4766;--bt:#10392c;--btn:#8fd5bc;--btn2:#b9dcf7;
 --mint:#dcf3e9;--peach:#ffe6d6;--lav:#ebe4fb;--sky:#dcecfc;--butter:#fff1c7;--rose:#fde2e9;--mint-i:#2b8566;--peach-i:#b8612f;--lav-i:#6a4fbf;--sky-i:#2f6fae;--butter-i:#946c0c;--rose-i:#b83d62;--sh:0 1px 2px rgba(70,50,100,.04),0 6px 18px rgba(70,50,100,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161c;--card:#211f29;--text:#f2eff7;--muted:#a49eaf;--line:#34303e;--accent:#8fd8bf;--soft:#21352e;--pos:#7fd6a8;--neg:#f59aae;--bt:#0f2b22;--btn:#7fcfb2;--btn2:#8db9e0;--mint:rgba(127,207,178,.15);--peach:rgba(245,169,127,.15);--lav:rgba(179,154,232,.17);--sky:rgba(127,176,232,.15);--butter:rgba(242,195,94,.15);--rose:rgba(240,138,156,.15);--mint-i:#9fe3c9;--peach-i:#f8c09f;--lav-i:#cdbaf5;--sky-i:#a9cdf3;--butter-i:#f3d58f;--rose-i:#f6aebd;--sh:0 1px 2px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#17161c;--card:#211f29;--text:#f2eff7;--muted:#a49eaf;--line:#34303e;--accent:#8fd8bf;--soft:#21352e;--pos:#7fd6a8;--neg:#f59aae;--bt:#0f2b22;--btn:#7fcfb2;--btn2:#8db9e0;--mint:rgba(127,207,178,.15);--peach:rgba(245,169,127,.15);--lav:rgba(179,154,232,.17);--sky:rgba(127,176,232,.15);--butter:rgba(242,195,94,.15);--rose:rgba(240,138,156,.15);--mint-i:#9fe3c9;--peach-i:#f8c09f;--lav-i:#cdbaf5;--sky-i:#a9cdf3;--butter-i:#f3d58f;--rose-i:#f6aebd;--sh:0 1px 2px rgba(0,0,0,.25)}
body{font-family:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg) radial-gradient(1200px 420px at 85% -120px,var(--lav),transparent 70%) no-repeat}
h1{font-size:24px;font-weight:800;letter-spacing:-.3px}h2{font-weight:700}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;padding:16px 18px;border-radius:22px;background:linear-gradient(120deg,var(--mint),var(--sky) 55%,var(--lav));position:relative;overflow:hidden}
.hero .sub{margin:2px 0 0}.hero-t{min-width:0}.hello{font-size:13px;font-weight:600;color:var(--mint-i)}
.hero-art{width:150px;height:98px;flex:none}@media (max-width:480px){.hero-art{width:96px;height:64px}h1{font-size:20px}}
nav{border-bottom:0;gap:6px;padding:8px 0;margin-bottom:12px;background:var(--bg)}
nav button{border:0;border-radius:999px;padding:9px 16px;font-size:15px;font-weight:700;transition:background .15s,color .15s}
nav button:hover{background:var(--card);color:var(--text)}
nav button.on{background:var(--mint);color:var(--mint-i)}
nav button[data-k="dt"].on{background:var(--sky);color:var(--sky-i)}nav button[data-k="mt"].on{background:var(--peach);color:var(--peach-i)}nav button[data-k="bh"].on{background:var(--lav);color:var(--lav-i)}
nav .tm{border-radius:50%;padding:9px}
.card{border-radius:18px;box-shadow:var(--sh);border-color:var(--line)}
.click:hover{border-color:var(--btn);transform:translateY(-1px)}.click{transition:transform .15s,border-color .15s}
.chip{border-radius:999px;padding:5px 13px}.chip.on{background:var(--mint);color:var(--mint-i);border-color:transparent;font-weight:600}
.rsw{border-radius:999px;color:var(--mint-i)}
.btn{background:linear-gradient(135deg,var(--btn),var(--btn2));color:var(--bt);border-radius:10px;font-weight:600;padding:7px 14px}.btn:hover{filter:brightness(1.04)}
.btn.g{background:var(--card)}
input,select,textarea{border-radius:10px}input:focus,select:focus,textarea:focus{outline:2px solid var(--btn);outline-offset:0;border-color:transparent}
.tag{background:var(--lav);color:var(--lav-i);font-weight:600}
.bar{height:10px;background:var(--soft)}.bar i{background:linear-gradient(90deg,var(--btn),var(--btn2))}
.stat .l{display:flex;align-items:center;gap:7px;font-weight:500}
.si{width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none;background:var(--mint)}
.grid>.stat:nth-child(6n+2) .si{background:var(--peach)}.grid>.stat:nth-child(6n+3) .si{background:var(--lav)}.grid>.stat:nth-child(6n+4) .si{background:var(--sky)}.grid>.stat:nth-child(6n+5) .si{background:var(--butter)}.grid>.stat:nth-child(6n) .si{background:var(--rose)}
.stat .v{font-size:19px;font-weight:700;margin-top:6px}.kpi .v{font-size:23px}
.hi{display:inline-flex;margin-right:7px}
.av{width:36px;height:36px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:none;margin-right:4px}
.empty:before{content:"🍃";margin-right:6px}
.md{background:rgba(40,30,60,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mc{border-radius:22px}
.fab{background:linear-gradient(135deg,#ffffff,#f3eefc);box-shadow:0 8px 24px rgba(90,60,140,.25)}
.fabm{border-radius:18px}
.pc{border-radius:16px}.pc:hover{border-color:var(--btn);box-shadow:var(--sh)}.im{border-radius:12px;height:76px;font-size:34px}.im.sm{font-size:20px;border-radius:10px}
.pay{background:linear-gradient(135deg,var(--btn),var(--btn2));color:var(--bt);border-radius:14px}
.qb{border-radius:10px}
th{font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- nhập đơn bằng giọng nói ---------- */
.srow{display:flex;gap:8px;margin-bottom:10px}.srow input{margin:0!important}
.mic{flex:none;width:48px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--rose),var(--lav));font-size:20px;cursor:pointer}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,138,156,.55)}70%{box-shadow:0 0 0 12px rgba(240,138,156,0)}100%{box-shadow:0 0 0 0 rgba(240,138,156,0)}}
.vbox{background:linear-gradient(135deg,var(--rose),var(--lav) 60%,var(--card));margin-bottom:12px}

.vl{display:grid;grid-template-columns:minmax(0,1fr) 64px 30px;gap:6px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.vl small{grid-column:1/4;color:var(--muted);font-size:12px;margin-bottom:-4px}.vl.bad select{outline:2px solid var(--neg)}
.dotl{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--neg);margin-right:6px;animation:pulse 1.2s infinite}
/* ---------- 0.0.6: popup, tài khoản, ảnh tải lên, thanh mục con cố định ---------- */
.mx{position:sticky;top:-6px;float:right;margin:-6px -8px 4px 8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--text);font-size:22px;line-height:1;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center}.mx:hover{background:var(--rose);color:var(--rose-i)}
.sbn{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh,56px));z-index:5;background:var(--bg);flex-wrap:nowrap;overflow-x:auto;padding:6px 0 8px;margin:-4px 0 10px;scrollbar-width:none}.sbn::-webkit-scrollbar{display:none}.sbn .chip{flex:none}
.cart{top:calc(env(safe-area-inset-top,0px) + var(--navh,56px) + 58px)}
.wrap{position:relative}.hero{padding-right:64px}
.acct{position:absolute;top:30px;right:28px;z-index:8}
.avb{width:42px;height:42px;border-radius:50%;border:2px solid var(--card);background:var(--butter);font-size:23px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--sh);padding:0}.avb:hover{transform:scale(1.06)}.avb.sm{width:38px;height:38px;font-size:20px;cursor:default;transform:none}
.accm{position:absolute;right:0;top:50px;width:270px;padding:8px;margin:0;box-shadow:0 12px 34px rgba(60,40,90,.22)}.accm[hidden]{display:none}
.acch{display:flex;gap:10px;align-items:center;padding:4px 6px 6px}.acch .n{min-width:0}.acch small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.accm button[data-a]{display:flex;width:100%;text-align:left;gap:8px;background:none;border:0;border-radius:10px;padding:10px;font:inherit;font-size:14px;color:var(--text);cursor:pointer}.accm button[data-a]:hover{background:var(--soft)}
