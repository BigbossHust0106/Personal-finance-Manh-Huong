<style>

var FABS={tong:[["inc","Thêm thu nhập","#4285F4"],["exp","Thêm chi tiêu","#EA4335"]],dt:[["asset","Danh mục tài sản","#34A853"],["dep","Nạp / rút tiền","#FBBC05"]],mt:[["cash","Cập nhật số dư tiền mặt","#34A853"],["goal","Mục tiêu mới","#EA4335"],["contrib","Đóng góp vào mục tiêu","#4285F4"],["incx","Thu nhập ngoài định kỳ","#FBBC05"]]};

var NEW="__new__";

 return{v:2,incCats:I.map(function(x){return{id:uid(),name:x[0],irr:x[1]}}),expCats:Object.keys(E).map(function(n){return{id:uid(),name:n,subs:E[n].map(function(s){return{id:uid(),name:s}})}}),inc:[],exp:[],assets:[],itx:[],prices:[],dep:[],cash:[],goals:[],contrib:[],invTarget:{value:0,ret:0}}}

 (o.income||[]).forEach(function(x){n.inc.push({id:uid(),date:t,createdAt:at,name:x.name,member:x.own||"Chung",cat:n.incCats[0].id,amt:x.amt||0,note:N})});

 (o.inv||[]).forEach(function(x){var a={id:uid(),sym:String(x.name).toUpperCase().slice(0,12),name:x.name,type:TM[x.type]||"other",price:x.val||0,priceAt:at,note:""};n.assets.push(a);n.prices.push({id:uid(),asset:a.id,date:t,at:at,price:a.price});n.itx.push({id:uid(),date:t,at:at,asset:a.id,type:"buy",qty:1,price:x.cost||0,fee:0,tax:0,note:N})});

function calc(list){var L=list.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.at||"")<(b.at||"")?-1:1}),P={},sells=[],err=null;

function fMembers(){form("Thêm thành viên",[{k:"em",l:"Email (người đó phải tạo tài khoản trên trang này trước)",t:"text"},{k:"role",l:"Quyền",t:"sel",o:[["editor","Được chỉnh sửa"],["viewer","Chỉ xem"],["owner","Chủ (toàn quyền)"]]}],{em:"",role:"editor"},function(v){if(!/.+@.+/.test(v.em))return"Email không hợp lệ";SB.rpc("add_member_by_email",{p_household:HID,p_email:v.em.trim(),p_role:v.role}).then(function(r){alert(r.error?"Không thêm được: "+r.error.message:"Đã thêm "+v.em)})})}
function start(){SB.auth.getSession().then(function(r){USER=r.data.session&&r.data.session.user;if(!USER)return authUI();
 SB.from("household_members").select("household_id,role").eq("user_id",USER.id).limit(1).then(function(m){var h=m.data&&m.data[0];
  if(!h){$("#sync").innerHTML=esc(USER.email)+' · <a href="#" data-a="signout">Đăng xuất</a>';$("#main").innerHTML='<div class="card"><h2>Chưa thuộc hộ gia đình nào</h2><p>Nếu vợ/chồng đã có hộ, hãy nhờ họ thêm email <b>'+esc(USER.email)+'</b> vào mục Thành viên. Hoặc tạo hộ mới:</p><button class="btn" data-a="mkhh">Tạo hộ gia đình mới</button></div>';return}
  HID=h.household_id;ROLE=h.role;RO=ROLE=="viewer";document.body.classList.toggle("ro",RO);
  SB.from("finance_data").select("data").eq("household_id",HID).single().then(function(r){if(r.data&&r.data.data&&r.data.data.v==2)load(JSON.stringify(r.data.data));else D=blank();render();
   $("#sync").innerHTML=esc(USER.email)+" · quyền: "+({owner:"chủ",editor:"chỉnh sửa",viewer:"chỉ xem"})[ROLE]+' · <a href="#" data-a="signout">Đăng xuất</a>'+(ROLE=="owner"?' · <a href="#" data-a="members">Thành viên</a>':"");
   SB.channel("fd").on("postgres_changes",{event:"UPDATE",schema:"public",table:"finance_data",filter:"household_id=eq."+HID},function(p){if(p.new.client!=CID&&!FM&&p.new.data&&p.new.data.v==2){load(JSON.stringify(p.new.data));render()}}).subscribe()})})})}
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
 if(a=="signin"||a=="signup"){var em=$("#ae").value.trim(),pw=$("#ap").value;SB.auth[a=="signin"?"signInWithPassword":"signUp"]({email:em,password:pw}).then(function(r){if(r.error)return authUI(r.error.message);if(a=="signup"&&!r.data.session)return authUI("Đã gửi email xác nhận. Hãy xác nhận rồi đăng nhập.");start()})}
 else if(a=="signout"){e.preventDefault();SB.auth.signOut().then(function(){location.reload()})}
 else if(a=="members"){e.preventDefault();fMembers()}
 else if(a=="mkhh")SB.rpc("create_household",{p_name:"Gia đình"}).then(function(r){if(r.error)alert(r.error.message);else start()})});
D=blank();
if(!CFG.url||!CFG.key||/^DÁN/.test(CFG.url)){$("#main").innerHTML='<div class="card"><h2>Chưa cấu hình</h2><p>Mở file public/config.js, điền Project URL và anon public key của Supabase (xem HUONG-DAN.md).</p></div>'}
else{SB=supabase.createClient(CFG.url,CFG.key);start();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
